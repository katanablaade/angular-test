@if (isLoading()) {
<app-spinner />
} @else if (isError()) {
<app-error />
} @else {
<div class="container">
  <h2>Пользователи</h2>
  <ul class="user-list">
    @for (user of users(); track user.id) {
    <li (click)="router.navigate(['/users', user.id])" class="user-list-item">
      {{ user.firstName }}
    </li>
    }
  </ul>
</div>
}
