@if (isLoading()) {
<app-spinner />
} @else if (isError()) {
<app-error />
} @else if (user()) {
<div class="container">
  <h2>{{ user()!.firstName }}</h2>
  <p>Email: {{ user()!.email }}</p>
  <p>Gender: {{ user()!.gender }}</p>
  <p>Phone: {{ user()!.phone }}</p>
</div>
} @else {
<p>Пользователь не найден</p>
}
